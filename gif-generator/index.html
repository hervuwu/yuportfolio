<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIF Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>GIF Generator</h1>
        <div class="form-container">
            <input type="text" id="searchTerm" placeholder="Enter a search term (e.g., cats)">
            <input type="number" id="gifCount" value="10" min="1" max="50">
            <button id="generateBtn">Generate</button>
        </div>
        <div id="gif-container" class="gif-container"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
